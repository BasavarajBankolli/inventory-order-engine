# Local development environment.
#
#   docker compose up --build
#
# Start-up order (enforced with depends_on conditions):
#   postgres (healthy) -> migrate (runs once, exits 0) -> api
#                                                       -> worker
#
# Redis is added in a later stage.
#
# Values like ${POSTGRES_PASSWORD:-app_dev_password} read from your shell or
# from a .env file next to this file, falling back to a LOCAL-ONLY default.
# Never use these defaults in a real deployment.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run ONCE, when the data volume is first created.
      # We use it to create a separate database for automated tests.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_dev_password}@postgres:5432/${POSTGRES_DB:-inventory}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["/app/api"]
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_dev_password}@postgres:5432/${POSTGRES_DB:-inventory}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # LOCAL-ONLY default so `docker compose up` works out of the box.
      # Real deployments must inject a long random secret (never commit it).
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me-0123456789}
      JWT_TTL: ${JWT_TTL:-1h}
      RESERVATION_TTL: ${RESERVATION_TTL:-15m}
      PAYMENT_TIMEOUT: ${PAYMENT_TIMEOUT:-5s}
      MOCK_PAYMENT_OUTCOME: ${MOCK_PAYMENT_OUTCOME:-SUCCESS}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    command: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_dev_password}@postgres:5432/${POSTGRES_DB:-inventory}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-10s}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-100}
      PAYMENT_TIMEOUT: ${PAYMENT_TIMEOUT:-5s}
      PAYMENT_RECONCILE_AFTER: ${PAYMENT_RECONCILE_AFTER:-1m}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
